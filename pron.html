<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Video Player</title>

  <style>
    body {
      margin: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    video {
      width: 90%;
      max-width: 1200px;
      border-radius: 12px;
      background: #000;
      box-shadow: 0 0 25px rgba(255,255,255,0.15);
    }
  </style>
</head>
<body>

  <video controls autoplay>
    <source
      src="https://hidrive.ionos.com/lnk/Q9S81ZUWk"
      type="video/mp4">
    Your browser does not support the video tag.
  </video>

</body>
</html>
