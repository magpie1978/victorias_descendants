<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" /> <!--Says the page uses UTF-8 encoding (so accents, emoji, etc. work correctly).-->
    <meta name="viewport" content="width=device-width, initial-scale=1" /> <!-- Makes the page scale properly on phones/tablets (responsive design).-->
    <title>Queen Victoria's Descendants</title>

    <!-- IBM Plex Mono -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" type="text/css" href="tree.css">
    <script type="module" src="tree.js"></script>
    
    
  </head>
  <body>

  <header>
    <div class="header-left">
      <h1 class="header-title">Queen Victoria's Descendants</h1>
      <p class="header-desc">
        Explore the network of European royalty descended from Queen Victoria.
        Use the search to locate individuals and navigate through generations.
      </p>
      <br>

      <!-- EDITOR FUNCTIONALITY 
      <div class="editor-controls">
        <button id="editorLoginBtn" type="button">Editor login</button>
      
        <div id="editorToolbar" hidden>
          <span id="editorStatus">Edit mode</span>
          <button id="addPersonBtn" type="button">Add person</button>
          <button id="editorLogoutBtn" type="button">Log out</button>
        </div>
      </div>
      -->

      <!-- EDITOR LOGIN -
      <dialog id="editorLoginDialog">
        <form id="editorLoginForm">
          <h2>Editor login</h2>
      
          <label for="editorEmail">Email address</label>
          <input
            id="editorEmail"
            type="email"
            autocomplete="username"
            required
          >
      
          <label for="editorPassword">Password</label>
          <input
            id="editorPassword"
            type="password"
            autocomplete="current-password"
            required
          >
      
          <div id="editorLoginError" role="alert"></div>
      
          <div class="dialog-buttons">
            <button type="button" id="cancelEditorLogin">Cancel</button>
            <button type="submit">Log in</button>
          </div>
        </form>
      </dialog>
      -->

      <!-- NEW PERSON--
      <dialog id="addPersonDialog">
        <form id="addPersonForm">
          <h2>Add person</h2>
      
          <label for="newPersonId">Person ID</label>
          <input id="newPersonId" required>
      
          <label for="newPersonName">Name</label>
          <input id="newPersonName" required>
      
          <label for="newPersonTitle1">Primary title</label>
          <input id="newPersonTitle1">
      
          <label for="newPersonTitle2">Secondary title</label>
          <input id="newPersonTitle2">
      
          <label for="newPersonDob">Date of birth</label>
          <input id="newPersonDob">
      
          <label for="newPersonImage">Image URL</label>
          <input id="newPersonImage" type="url">
      
          <label for="newPersonBiography">Biography</label>
          <textarea id="newPersonBiography" rows="6"></textarea>
      
          <label for="newPersonFather">Father ID</label>
          <input id="newPersonFather">
      
          <label for="newPersonMother">Mother ID</label>
          <input id="newPersonMother">
      
          <label for="newPersonX">Horizontal position</label>
          <input id="newPersonX" type="number" value="100" required>
      
          <label for="newPersonY">Vertical position</label>
          <input id="newPersonY" type="number" value="100" required>
      
          <div id="addPersonError" role="alert"></div>
      
          <div class="dialog-buttons">
            <button type="button" id="cancelAddPerson">Cancel</button>
            <button type="submit">Add person</button>
          </div>
        </form>
      </dialog>
      -->

      
      <!-- DROPDOWN + SEARCH BELOW THE TEXT -->
      <div class="header-controls">
        <div id="branchwrap" title="Filter by branch (children of Queen Victoria)">
          <select id="branchSelect" aria-label="Select a branch (children of Queen Victoria)">
            <option value="">— Select a branch —</option>
          </select>
        </div>
        <div id="searchwrap">
          <input id="search" type="text" placeholder="Search by name or title…" autocomplete="off" aria-label="Search people by name or title" />
          <div id="suggest" role="listbox" aria-label="Search suggestions"></div>
        </div>
      </div>
    </div>

    <!-- Top-right nav buttons -->
    <div class="header-buttons">
      <a href="succession.html" class="header-btn">Line of Succession</a>
      <a href="index.html" class="header-btn">Family Tree</a>
    </div>
    
  </header>

  <!-- Scrollable region for the family tree -->
  <div id="scroll" aria-live="polite">
    <div id="world">
      <svg id="connector" viewBox="0 0 2400 1600" preserveAspectRatio="none"></svg>
      <div id="cards-root"></div>
    </div>
  </div>

  <!-- the left-hand side pop-out for biographies -->
  <div id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" aria-hidden="true">
    <div class="drawer-content">
      <h2 id="drawerTitle">Details</h2>
      <div class="drawer-body"></div>
    </div>
  </div>
  
  <!-- the dim background you click to close the drawer -->
  <div id="backdrop" aria-hidden="true"></div>

</body>
</html>
